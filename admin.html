

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Nour Academy</title>
    <link rel="stylesheet" href="/src/input.css">
    <script type="module" src="/src/js/dashboard.js"></script>
</head>
<body class="min-h-screen bg-[#E5E5E5] p-3 md:p-6">
    <main id="adminContent" class="mx-auto max-w-6xl border-[3px] border-[#9FB6CC] bg-[#1D5885] p-5 md:p-8">
        <nav class="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-full bg-[#D5E2EF] px-5 py-3 md:px-6">
            <h1 class="text-xl font-bold text-[#1D5885]">Nour Academy</h1>
            <div class="flex items-center gap-3 text-sm">
                <a href="inscriptions.html" class="rounded-full px-4 py-2 font-semibold text-[#263D50] hover:bg-white/50">Inscriptions</a>
                <a href="admin.html" class="rounded-full bg-[#F79428] px-3 py-2 font-semibold text-[#173E5B]">Tableau de bord</a>
                <button id="logoutButton" type="button" class="rounded-full bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700">Déconnexion</button>
            </div>
        </nav>
        <h2 class="mb-5 text-2xl font-bold text-[#F79428] md:text-3xl">
            <span class="mr-2">→</span> TABLEAU DE BORD
        </h2>
        <section class="mb-4 grid gap-4 md:grid-cols-2">
            <article class="rounded-3xl bg-[#F79428] p-5 text-[#173E5B]">
                <p class="mb-1 text-sm">Inscrits</p>
                <h3 id="totalInscriptions" class="text-3xl font-bold">0</h3>
                <p class="mt-1 text-sm">dossiers au total</p>
            </article>
            <article class="rounded-3xl bg-[#F79428] p-5 text-[#173E5B]">
                <p class="mb-1 text-sm">Recettes encaissées</p>
                <h3 id="totalRecettes" class="text-3xl font-bold">0 MAD</h3>
                <p class="mt-1 text-sm">Statut Payée</p>
            </article>
        </section>
        <section class="mb-4 rounded-3xl bg-[#D5E2EF] p-5 md:p-6">
            <h3 class="mb-4 text-xl font-bold text-[#1D5885]">Répartition par statut</h3>
            <div class="mb-3">
                <div class="mb-1 flex justify-between text-sm text-[#263D50]">
                    <span>En attente</span>
                    <span id="attenteCount">0/0</span>
                </div>
                <div class="h-2.5 overflow-hidden rounded-full bg-[#9FB6CC]">
                    <div id="attenteBar" class="h-full rounded-full bg-[#F79428]" style="width: 0%"></div>
                </div>
            </div>
            <div class="mb-3">
                <div class="mb-1 flex justify-between text-sm text-[#263D50]">
                    <span>Validée</span>
                    <span id="valideeCount">0/0</span>
                </div>
                <div class="h-2.5 overflow-hidden rounded-full bg-[#9FB6CC]">
                    <div id="valideeBar" class="h-full rounded-full bg-[#1D5885]" style="width: 0%"></div>
                </div>
            </div>
            <div>
                <div class="mb-1 flex justify-between text-sm text-[#263D50]">
                    <span>Payée</span>
                    <span id="payeeCount">0/0</span>
                </div>
                <div class="h-2.5 overflow-hidden rounded-full bg-[#9FB6CC]">
                    <div id="payeeBar" class="h-full rounded-full bg-[#173E5B]" style="width: 0%"></div>
                </div>
            </div>
        </section>
        <section class="rounded-3xl bg-[#D5E2EF] p-5 md:p-6">
            <h3 class="mb-4 text-xl font-bold text-[#1D5885]">
                Remplissage par cours (<span id="capaciteTotale">75</span> places)
            </h3>
            <div id="coursContainer"></div>
        </section>
        <footer class="mt-6 text-center text-xs text-[#D5E2EF]">
            Nour Academy · Tableau de bord administrateur
        </footer>
    </main>
</body>
</html>

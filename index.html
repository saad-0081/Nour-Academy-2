
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Nour Academy</title>
    <link rel="stylesheet" href="/src/input.css">
</head>
<body class="flex min-h-screen items-center justify-center bg-[#E5E5E5] p-4">
    <main class="w-full max-w-md rounded-3xl border-[3px] border-[#9FB6CC] bg-[#1D5885] p-6 shadow-xl sm:p-8">
        <h1 class="mb-2 text-center text-3xl font-bold text-[#F79428]">
            Nour Academy
        </h1>
        <p class="mb-6 text-center text-[#D5E2EF]">
            Espace de connexion
        </p>
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="role" class="mb-2 block font-semibold text-white">
                    Type de compte
                </label>
                <select id="role" required
                    class="w-full rounded-xl border border-[#9FB6CC] bg-white p-3 text-[#173E5B] outline-none focus:ring-2 focus:ring-[#F79428]">
                    <option value="admin">Administrateur</option>
                    <option value="secretaire">Secrétaire</option>
                </select>
            </div>
            <div>
                <label for="username" class="mb-2 block font-semibold text-white">
                    Nom d'utilisateur
                </label>
                <input id="username" type="text" required autocomplete="username"
                    placeholder="Nom d'utilisateur"
                    class="w-full rounded-xl border border-[#9FB6CC] bg-white p-3 text-[#173E5B] outline-none focus:ring-2 focus:ring-[#F79428]">
            </div>
            <div>
                <label for="password" class="mb-2 block font-semibold text-white">
                    Mot de passe
                </label>
                <input id="password" type="password" required autocomplete="current-password"
                    placeholder="Mot de passe"
                    class="w-full rounded-xl border border-[#9FB6CC] bg-white p-3 text-[#173E5B] outline-none focus:ring-2 focus:ring-[#F79428]">
            </div>
            <p id="loginError" role="alert" class="hidden text-sm text-red-200">
                Nom d'utilisateur ou mot de passe incorrect !
            </p>
            <button type="submit"
                class="w-full rounded-full bg-[#F79428] p-3 font-bold text-[#173E5B] transition hover:bg-orange-300">
                Se connecter
            </button>
        </form>
        <p class="mt-6 text-center text-xs text-[#D5E2EF]">
            Accès réservé au personnel de Nour Academy.
        </p>
    </main>
    <script>
        const loginForm = document.querySelector("#loginForm");
        const roleInput = document.querySelector("#role");
        const usernameInput = document.querySelector("#username");
        const passwordInput = document.querySelector("#password");
        const loginError = document.querySelector("#loginError");
        const comptes = {
            admin: {
                username: "admin",
                password: "Nour2026",
                page: "admin.html"
            },
            secretaire: {
                username: "secretaire",
                password: "Secret2026",
                page: "secretaire.html"
            }
        };
        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();
            const role = roleInput.value;
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const compte = comptes[role];
            if (
                username === compte.username &&
                password === compte.password
            ) {
                sessionStorage.setItem("roleConnecte", role);
                if (role === "admin") {
                    sessionStorage.setItem("adminConnecte", "oui");
                    sessionStorage.removeItem("secretaireConnecte");
                } else {
                    sessionStorage.setItem("secretaireConnecte", "oui");
                    sessionStorage.removeItem("adminConnecte");
                }
                window.location.href = compte.page;
            } else {
                loginError.classList.remove("hidden");
            }
        });
        roleInput.addEventListener("change", function() {
            loginError.classList.add("hidden");
        });
    </script>

</body>
</html>
